[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2-warehouse-fleet-reliability"
version = "0.1.0"
description = "Deterministic warehouse robot fleet reliability and incident-response lab"
requires-python = ">=3.10"

[project.scripts]
warehouse-fleet = "warehouse_fleet.cli:main"
warehouse-fleet-server = "warehouse_fleet.server:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["warehouse_fleet*"]
